server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/xml text/plain text/markdown application/json;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Настоящий 404 со страницей сайта (как на Timeweb, ADR 0003)
  error_page 404 /404.html;

  # хэшированные ассеты Vite и Astro
  location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  location ^~ /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    # каталог без слэша получает 301 на слэш
    try_files $uri $uri/ =404;
  }

  location = /404.html { internal; }
}
