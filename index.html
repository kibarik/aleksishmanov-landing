  <style>
    /* Critical CSS лоадера: первый экран рисуется до загрузки основного файла стилей */
    :root { --black: #0a0a0a; }
    html, body { margin: 0; background: var(--black); color: #fff; font-family: 'Manrope', system-ui, sans-serif; }
    body.is-loading { overflow: hidden; height: 100vh; height: 100svh; }
    /* без WebGL лоадера нет: фиксация высоты на время загрузки только давала сдвиг всей страницы (CLS ~0,7) при её снятии */
    html[data-webgl="off"] body.is-loading { overflow: visible; height: auto; }
    .loader { position: fixed; inset: 0; z-index: 50; background: var(--black); color: #fff; display: grid; place-items: center; transition: opacity 1s ease, visibility 1s; }
    .loader--done { opacity: 0; visibility: hidden; }
    .loader__inner { display: flex; flex-direction: column; align-items: center; gap: 28px; perspective: 900px; }
    .loader__art { transform-style: preserve-3d; transition: transform .95s cubic-bezier(.2,.8,.2,1), opacity .7s ease; }
    .loader__spiral { width: 160px; height: auto; color: rgba(255,255,255,.5); display: block; }
    .loader__path { stroke-dasharray: 100; stroke-dashoffset: 100; stroke-width: 1.4; stroke: #fff; filter: drop-shadow(0 0 6px rgba(255,255,255,.35)); }
    .loader__grid > * { stroke-dasharray: 100; stroke-dashoffset: 100; animation: loader-grid .9s cubic-bezier(.3,.8,.3,1) forwards; animation-delay: calc(var(--g) * 110ms); }
    @keyframes loader-grid { to { stroke-dashoffset: 0; } }
    /* Фоновое движение живёт на transform/opacity: их крутит compositor, и оно не замирает,
       когда главный поток занят разбором three и модели (раньше именно тогда «всё зависало») */
    .loader__spin { position: relative; animation: loader-sway 3.6s ease-in-out infinite alternate; transform-style: preserve-3d; }
    @keyframes loader-sway {
      from { transform: rotateY(-22deg) rotateX(6deg) translateY(-5px); }
      to   { transform: rotateY(22deg) rotateX(-4deg) translateY(5px); }
    }
    .loader__scan { position: absolute; left: -12%; right: -12%; top: 0; height: 2px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.9), transparent); box-shadow: 0 0 14px rgba(255,255,255,.55); opacity: 0; animation: loader-scan 1.9s cubic-bezier(.45,0,.55,1) infinite; pointer-events: none; }
    @keyframes loader-scan { 0% { transform: translateY(0); opacity: 0; } 12% { opacity: 1; } 88% { opacity: 1; } 100% { transform: translateY(256px); opacity: 0; } }
    .loader__pct { min-width: 3ch; text-align: right; font-variant-numeric: tabular-nums; }
    .loader__label::after { content: ''; width: 5px; height: 5px; margin: auto 0 auto -4px; border-radius: 50%; background: #fff; animation: loader-blink 1s steps(2, jump-none) infinite; }
    @keyframes loader-blink { from { opacity: 1; } to { opacity: .15; } }
    .loader__label { font-size: 12px; letter-spacing: .12em; color: rgba(255,255,255,.7); display: flex; gap: 14px; transition: opacity .5s ease; }
    .loader__quote { text-align: center; font-size: 14px; line-height: 1.9; color: rgba(255,255,255,.85); max-width: 22em; padding: 0 16px; text-wrap: balance; transition: opacity .5s ease, transform .6s ease; }
    /* финал: иконка наклоняется и уходит в глубину, подписи гаснут — как у референса */
    .loader--out .loader__art { transform: rotateX(16deg) rotateY(-24deg) translateZ(-60px) scale(.9); opacity: 0; }
    .loader--out .loader__label { opacity: 0; }
    .loader--out .loader__quote { opacity: 0; transform: translateY(-8px); }
    html[data-webgl="off"] .loader { display: none; }
    @media (prefers-reduced-motion: reduce) { .loader__spin, .loader__scan, .loader__label::after { animation: none; } .loader__art { transition: opacity .4s ease; } .loader__grid > * { animation: none; stroke-dashoffset: 0; } }

  <script>
    // WebGL-проверка до загрузки бандла: при провале сцена не импортируется, показываем кадр
    (function () {
      var ok = false;
      try {
        var c = document.createElement('canvas');
        var o = { failIfMajorPerformanceCaveat: true };
        ok = !!(c.getContext('webgl2', o) || c.getContext('webgl', o));
      } catch (e) { ok = false; }
      if (!ok) {
        document.documentElement.dataset.webgl = 'off';
        // кадр-заглушка — главный элемент первого экрана (LCP): просим его сразу, а не после раскладки
        var pre = document.createElement('link');
        pre.rel = 'preload'; pre.as = 'image'; pre.fetchPriority = 'high';
        pre.href = window.innerWidth <= 1024 ? './fallback/white-mobile.webp' : './fallback/white-desktop.webp';
        document.head.appendChild(pre);
        return;
      }
      // preload модели по тому же брейкпоинту, что и пресет сцены (1024): грузится параллельно бандлу.
      // Ставим только при живом WebGL — иначе фолбэк тянул бы модель впустую.
      // Модель качаем сами, одним потоковым запросом, ещё до разбора бандла: так виден реальный
      // прогресс и нет второй загрузки (link rel=preload не переиспользовался загрузчиком three).
      // Тяжёлое для сцены просим сразу, параллельно модели: иначе чанк three стартует только после
      // разбора index.js и boot3d.js, а декодер draco — после чанка three (цепочка в 10+ с на медленной сети).
      // Список чанков кладёт сборка (scripts/vite-preload.mjs); modulepreload браузер потом переиспользует.
      function hint(rel, href, as) {
        var l = document.createElement('link');
        l.rel = rel; l.href = href;
        if (as) l.as = as;
        if (as === 'fetch') l.crossOrigin = 'anonymous'; // FileLoader качает fetch'ем, тот же режим
        document.head.appendChild(l);
      }
      (window.__sceneChunks || []).forEach(function (href) { hint('modulepreload', href); });
      hint('preload', './draco/draco_wasm_wrapper.js', 'fetch');
      hint('preload', './draco/draco_decoder.wasm', 'fetch');
      var url = window.innerWidth <= 1024 ? './models/character-mobile.glb' : './models/character.glb';
      window.__modelProgress = 0;
      window.__model = fetch(url).then(function (res) {
        var total = Number(res.headers.get('content-length')) || 0;
        if (!res.body || !total) return res.arrayBuffer();
        var reader = res.body.getReader();
        var chunks = [];
        var got = 0;
        return new Promise(function (resolve, reject) {
          (function pump() {
            reader.read().then(function (r) {
              if (r.done) {
                var buf = new Uint8Array(got);
                var off = 0;
                for (var i = 0; i < chunks.length; i++) { buf.set(chunks[i], off); off += chunks[i].length; }
                window.__modelProgress = 1;
                resolve(buf.buffer);
                return;
              }
              chunks.push(r.value);
              got += r.value.length;
              window.__modelProgress = got / total;
              pump();
            }).catch(reject);
          })();
        });
      });
    })();
  </script>

  <script>
    // Прогресс лоадера ведём здесь, а не в модуле сцены: чанк three грузится секунду и дольше,
    // и всё это время полоса стояла бы на нуле. Сцена только сообщает о готовности (__sceneReady).
    (function () {
      if (document.documentElement.dataset.webgl === 'off') return;
      var loader = document.getElementById('loader');
      var pct = document.getElementById('loader-pct');
      var path = document.querySelector('.loader__path');
      var last = performance.now();
      var creep = 0;
      var shown = 0;
      var ease = function (t) { return 1 - Math.pow(1 - t, 2.2); };
      // Прогресс идёт по этапам, а не по часам: часы бежали во время зависания потока, и полоса
      // прыгала с 23% до 95%, а потом стояла. Теперь потолок задаёт этап, а шаг времени ограничен.
      //   качается модель      → до 72%  (реальный прогресс скачивания × 0.72)
      //   загружен модуль сцены → до 96%  (сцена собирается: разбор, текстуры, шейдеры)
      //   сцена готова         → 100%
      (function tick() {
        var now = performance.now();
        var dt = Math.min(now - last, 50);
        last = now;
        var ready = !!window.__sceneReady;
        var ceil = ready ? 1 : window.__bundleReady ? 0.96 : 0.72;
        var floor = Math.max((window.__modelProgress || 0) * 0.72, window.__bundleReady ? 0.72 : 0);
        creep += (ceil - creep) * (1 - Math.exp(-dt / 2400)); // медленно ползёт к потолку этапа, не стоит на месте
        var target = ready ? 1 : Math.min(Math.max(floor, creep), ceil);
        shown += (target - shown) * (1 - Math.exp(-dt / (ready ? 90 : 260)));
        if (ready && shown > 0.995) shown = 1;
        pct.textContent = Math.round(shown * 100) + '%';
        path.style.strokeDashoffset = 100 - ease(shown) * 100;
        if (shown < 1) requestAnimationFrame(tick);
        else {
          loader.classList.add('loader--out'); // финальный наклон иконки
          window.dispatchEvent(new CustomEvent('loader:done'));
        }
      })();
    })();
  </script>
