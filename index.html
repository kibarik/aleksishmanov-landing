<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Алекс Ишманов — AI-платформы и практикумы</title>
  <meta name="description" content="Превращаю идеи в работающие бизнес-платформы. Проекты и практикумы по AI-разработке и продуктовому менеджменту: PO-нейробаза, PMF-стратегии, промты." />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="ru_RU" />
  <meta property="og:site_name" content="Aleks Ishmanov" />
  <meta property="og:title" content="Алекс Ишманов — AI-платформы и практикумы" />
  <meta property="og:description" content="Превращаю идеи в работающие бизнес-платформы. Проекты и практикумы по AI-разработке и продуктовому менеджменту: PO-нейробаза, PMF-стратегии, промты." />
  <meta property="og:url" content="https://aleksishmanov.ru/" />
  <meta property="og:image" content="https://aleksishmanov.ru/fallback/white-desktop.webp" />
  <meta name="twitter:card" content="summary_large_image" />
  <style>
    /* Critical CSS лоадера: первый экран рисуется до загрузки основного файла стилей */
    :root { --black: #0a0a0a; }
    html, body { margin: 0; background: var(--black); color: #fff; font-family: 'Manrope', system-ui, sans-serif; }
    body.is-loading { overflow: hidden; height: 100vh; height: 100svh; }
    .loader { position: fixed; inset: 0; z-index: 50; background: var(--black); color: #fff; display: grid; place-items: center; transition: opacity 1s ease, visibility 1s; }
    .loader--done { opacity: 0; visibility: hidden; }
    .loader__inner { display: flex; flex-direction: column; align-items: center; gap: 28px; }
    .loader__spiral { width: 160px; height: auto; color: rgba(255,255,255,.5); }
    .loader__path { stroke-dasharray: 100; stroke-dashoffset: 100; stroke-width: 1.4; stroke: #fff; }
    .loader__label { font-size: 12px; letter-spacing: .12em; color: rgba(255,255,255,.7); display: flex; gap: 14px; }
    .loader__quote { text-align: center; font-size: 14px; line-height: 1.9; color: rgba(255,255,255,.85); max-width: 22em; padding: 0 16px; text-wrap: balance; }
    html[data-webgl="off"] .loader { display: none; }
  </style>
  <link rel="stylesheet" href="./src/style.css" />
  <script>
    // WebGL-проверка до загрузки бандла: при провале сцена не импортируется, показываем кадр
    (function () {
      var ok = false;
      try {
        var c = document.createElement('canvas');
        var o = { failIfMajorPerformanceCaveat: true };
        ok = !!(c.getContext('webgl2', o) || c.getContext('webgl', o));
      } catch (e) { ok = false; }
      if (!ok) { document.documentElement.dataset.webgl = 'off'; return; }
      // preload модели по тому же брейкпоинту, что и пресет сцены (1024): грузится параллельно бандлу.
      // Ставим только при живом WebGL — иначе фолбэк тянул бы модель впустую.
      var l = document.createElement('link');
      l.rel = 'preload';
      l.as = 'fetch';
      l.type = 'model/gltf-binary';
      l.crossOrigin = 'anonymous';
      l.setAttribute('fetchpriority', 'high');
      l.href = window.innerWidth <= 1024 ? './models/character-mobile.glb' : './models/character.glb';
      document.head.appendChild(l);
    })();
  </script>
</head>
<body class="is-loading">
  <div class="loader" id="loader">
    <div class="loader__inner">
      <svg class="loader__spiral" viewBox="0 0 200 320" fill="none" stroke="currentColor" stroke-width="1">
        <rect x="1" y="1" width="198" height="318" />
        <line x1="1" y1="199" x2="199" y2="199" />
        <line x1="79" y1="199" x2="79" y2="319" />
        <line x1="1" y1="241" x2="79" y2="241" />
        <line x1="43" y1="199" x2="43" y2="241" />
        <path class="loader__path" pathLength="100" d="M1 1 A198 198 0 0 1 199 199 A120 120 0 0 1 79 319 A78 78 0 0 1 1 241 A42 42 0 0 1 43 199" />
      </svg>
      <div class="loader__label"><span>loading</span><span class="loader__pct" id="loader-pct">0%</span></div>
      <p class="loader__quote" id="loader-offer"></p>
    </div>
  </div>

  <div class="hero" id="hero">
    <canvas id="scene" class="scene"></canvas>
    <picture class="fallback" id="fallback">
      <source media="(max-width: 1024px)" srcset="./fallback/white-mobile.webp" />
      <img src="./fallback/white-desktop.webp" alt="Статуя Алекса Ишманова на пьедестале с надписью ALEKS ISHMANOV" decoding="async" />
    </picture>
    <p class="tagline" id="tagline"></p>
    <a class="ask" id="ask-scene" target="_blank" rel="noopener noreferrer">
      <span class="ask__chevron" aria-hidden="true">›</span>
      <span class="ask__label"></span>
      <span class="ask__send" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22 11 13 2 9z"/></svg></span>
    </a>
  </div>

  <header class="nav" id="nav">
    <a class="nav__logo" href="#">ALEKS</a>
    <div class="nav__right">
      <a class="nav__ask" id="ask-nav" target="_blank" rel="noopener noreferrer"></a>
      <button class="nav__menu" id="menu-toggle" type="button" aria-label="Меню" aria-expanded="false" aria-controls="menu"><span></span><span></span></button>
    </div>
  </header>

  <div class="scroll-hint" id="scroll-hint">
    <div class="scroll-hint__mouse"><span></span></div>
    <span class="scroll-hint__text">[ scroll down ]</span>
  </div>

  <main class="content" id="content"></main>

  <div class="menu" id="menu" aria-hidden="true"></div>

  <div class="grain" aria-hidden="true"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
