<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" width="1200" height="1000" font-family="system-ui, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Цикл продуктового решения: 4 этапа и 8 методов</title>
<desc id="d">Четыре этапа сверху вниз: понять задачу, выбрать, проверить дёшево, решить и запустить. На каждом этапе два метода и ошибка, которую метод снимает. Выводы после запуска возвращаются в начало цикла.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2f6fdb"/></marker></defs>
<rect x="0" y="0" width="1200" height="1000" fill="#ffffff"/>
<text x="30" y="62" font-size="40" font-weight="700" fill="#1a1a1a">Цикл продуктового решения</text>
<text x="30" y="110" font-size="26" fill="#1a1a1a">4 этапа, 8 методов. Под названием метода — ошибка, которую он снимает</text>
<rect x="30" y="170" width="250" height="150" rx="14" fill="#ffffff" stroke="#2f6fdb" stroke-width="3"/>
<text x="54" y="212" font-size="24" fill="#2f6fdb" font-weight="600">Этап 1</text>
<text x="54" y="256" font-size="30" font-weight="700" fill="#1a1a1a">Понять</text>
<text x="54" y="294" font-size="30" font-weight="700" fill="#1a1a1a">задачу</text>
<rect x="300" y="170" width="405" height="150" rx="14" fill="#ffffff" stroke="#c8c8c2" stroke-width="2"/>
<text x="322" y="234" font-size="27" font-weight="700" fill="#1a1a1a">Исследование STORM</text>
<text x="322" y="280" font-size="24" fill="#1a1a1a">вход в тему без карты</text>
<rect x="725" y="170" width="405" height="150" rx="14" fill="#ffffff" stroke="#c8c8c2" stroke-width="2"/>
<text x="747" y="234" font-size="27" font-weight="700" fill="#1a1a1a">Интервью Mom Test</text>
<text x="747" y="280" font-size="24" fill="#1a1a1a">сигнал без цены</text>
<line x1="155" y1="324" x2="155" y2="354" stroke="#2f6fdb" stroke-width="3" marker-end="url(#ar)"/>
<rect x="30" y="360" width="250" height="150" rx="14" fill="#ffffff" stroke="#2f6fdb" stroke-width="3"/>
<text x="54" y="402" font-size="24" fill="#2f6fdb" font-weight="600">Этап 2</text>
<text x="54" y="446" font-size="30" font-weight="700" fill="#1a1a1a">Выбрать,</text>
<text x="54" y="484" font-size="30" font-weight="700" fill="#1a1a1a">что делать</text>
<rect x="300" y="360" width="405" height="150" rx="14" fill="#ffffff" stroke="#c8c8c2" stroke-width="2"/>
<text x="322" y="424" font-size="27" font-weight="700" fill="#1a1a1a">Дерево возможностей</text>
<text x="322" y="470" font-size="24" fill="#1a1a1a">одно решение</text>
<rect x="725" y="360" width="405" height="150" rx="14" fill="#ffffff" stroke="#c8c8c2" stroke-width="2"/>
<text x="747" y="424" font-size="27" font-weight="700" fill="#1a1a1a">Карта допущений</text>
<text x="747" y="470" font-size="24" fill="#1a1a1a">проверка удобного</text>
<line x1="155" y1="514" x2="155" y2="544" stroke="#2f6fdb" stroke-width="3" marker-end="url(#ar)"/>
<rect x="30" y="550" width="250" height="150" rx="14" fill="#ffffff" stroke="#2f6fdb" stroke-width="3"/>
<text x="54" y="592" font-size="24" fill="#2f6fdb" font-weight="600">Этап 3</text>
<text x="54" y="636" font-size="30" font-weight="700" fill="#1a1a1a">Проверить</text>
<text x="54" y="674" font-size="30" font-weight="700" fill="#1a1a1a">дёшево</text>
<rect x="300" y="550" width="405" height="150" rx="14" fill="#ffffff" stroke="#c8c8c2" stroke-width="2"/>
<text x="322" y="614" font-size="27" font-weight="700" fill="#1a1a1a">Ценность информации</text>
<text x="322" y="660" font-size="24" fill="#1a1a1a">измерение лёгкого</text>
<rect x="725" y="550" width="405" height="150" rx="14" fill="#ffffff" stroke="#c8c8c2" stroke-width="2"/>
<text x="747" y="614" font-size="27" font-weight="700" fill="#1a1a1a">Атомарные исследования</text>
<text x="747" y="660" font-size="24" fill="#1a1a1a">потерянное знание</text>
<line x1="155" y1="704" x2="155" y2="734" stroke="#2f6fdb" stroke-width="3" marker-end="url(#ar)"/>
<rect x="30" y="740" width="250" height="150" rx="14" fill="#ffffff" stroke="#2f6fdb" stroke-width="3"/>
<text x="54" y="782" font-size="24" fill="#2f6fdb" font-weight="600">Этап 4</text>
<text x="54" y="826" font-size="30" font-weight="700" fill="#1a1a1a">Решить и</text>
<text x="54" y="864" font-size="30" font-weight="700" fill="#1a1a1a">запустить</text>
<rect x="300" y="740" width="405" height="150" rx="14" fill="#ffffff" stroke="#c8c8c2" stroke-width="2"/>
<text x="322" y="804" font-size="27" font-weight="700" fill="#1a1a1a">Анализ гипотез (ACH)</text>
<text x="322" y="850" font-size="24" fill="#1a1a1a">предвзятое чтение</text>
<rect x="725" y="740" width="405" height="150" rx="14" fill="#ffffff" stroke="#c8c8c2" stroke-width="2"/>
<text x="747" y="804" font-size="27" font-weight="700" fill="#1a1a1a">Премортем</text>
<text x="747" y="850" font-size="24" fill="#1a1a1a">оптимизм перед запуском</text>
<path d="M1130 815 H1165 V245 H1136" fill="none" stroke="#2f6fdb" stroke-width="3" marker-end="url(#ar)"/>
<text x="30" y="960" font-size="26" fill="#1a1a1a">Выводы после запуска становятся фактами для следующего цикла</text>
</svg>
